name: CI

# Pull requests only: a push to main runs typecheck and tests in installer.yml, before it builds. Lint runs here only,
# so a style slip can't block a release build.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and unit tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
